# Machine learning

.pull-left[
- Learns patterns from data
- Comprises of different fields
    - Linear algebra, statistics and probability
    - Programming
    - Data analysis
    - Visualization
- Applicable to data from multiple fields - protein and DNA sequences, weather data, stock and house prices, images ...

]

.pull-right[ ![Machine learning](/training-material/topics/statistics/tutorials/machinelearning/images/it1.png)]

# Variants of ML

.center[ ![ML variants](/training-material/topics/statistics/tutorials/machinelearning/images/it2.png)]

# Classification

.pull-left[
- Supervised learning
- Learn/predict classes or targets 
- Find decision boundary
- Linear and non-linear boundaries
- Algorithms are classifiers
- Examples
    - Tumor or no tumor
    - Rain or no rain
    - ...
]

.pull-right[ ![Classification](/training-material/topics/statistics/tutorials/machinelearning/images/it3.png)]

---

# Classification dataset

- Breast tumor dataset - Features and target

.center[  ![Classification dataset](/training-material/topics/statistics/tutorials/machinelearning/images/it4.png)]

---

# Regression

.pull-left[
- Supervised learning
- Targets are real numbers
- Find fitting curve 
- Linear or non-linear curves
- Algorithms are regressors
- Examples:
    - Temperature forecast
    - Stock/house prices
    - ...

]

.pull-right[ ![Regression](/training-material/topics/statistics/tutorials/machinelearning/images/it5.png)]

---

# Regression dataset

- Body fat dataset - features and target

.center[ ![Ensemble model](/training-material/topics/statistics/tutorials/machinelearning/images/it6.png)]

.pull-left[

- Random search

]

# Learning and evaluation

.pull-left[
- K-fold cross-validation
- Dataset in K equal parts
- Part == fold
- Learn on training set
- Evaluate on validation set

]

.pull-right[ ![Learning and evaluation](/training-material/topics/statistics/tutorials/machinelearning/images/it8.png)]

### &lt;i class=&quot;fas fa-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;visually-hidden&quot;&gt;keypoints&lt;/span&gt; Key points


- Machine learning algorithms learn features from data.

- It is used for multiple tasks such as classification, regression, clustering and so on.

- Multiple learning tasks can be performed using Galaxy&apos;s machine learning tools.

- For the classification and regression tasks, data is divided into training and test sets.

- Each sample/record in the training data has a category/class/label.

- A machine learning algorithm learns features from the training data and do predictions on the test data.
