# Regression

.pull-left[
- Supervised learning
- Real valued targets
- Cost/error/loss functions
- Algorithms
    - Linear model
    - Support vectors
    - Tree and Ensemble
- Used for
    - [Predict gene expression pattern](https://www.frontiersin.org/articles/10.3389/fgene.2019.00120/full)
    - [Estimate DNA copy number](https://academic.oup.com/bioinformatics/article/28/18/2357/252846)
    - [Identify drug response](https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2881366/)
]

.pull-right[ ![Ensemble model](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r0.png)]

---

# Cost function

.pull-left[
- Mathematical functions
- Error = True - Predicted
- Examples
    - Mean squared error
    - Mean absolute error
    - Coefficient of determination (R2)
    - ...
]

.pull-right[ ![Ensemble model](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r0_1.png)]

---

# Linear models

.pull-left[
- Learn weight/coefficient for each feature
- y (predicted target) = w0 + w1 x Feature 1 + w2 x Feature 2 + .. +  wN x Feature N
- w (weights) = [w0, w1, w2, …, wN]
- X (input features) = [Feature1, Feature2, …, FeatureN]
- Examples
    - Linear regression
    - Ridge regression
    - ElasticNet
- Different variants of the minimisation equation
- Advantage: Simple and fast
- Disadvantage: Problems in learning non-linear relations
]

.pull-right[ ![Linear model](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r1.png)]

---

# Support vector machines

.pull-left[
- Linear and non-linear variants
- Support vectors
- Advantages
    - High-dimensional data 
    - Number of samples &lt;&lt; number of dimensions
    - Memory efficient - uses only support vectors
- Disadvantages
    - Large runtime
    - Scale invariant
- Examples: SVR, NuSVR, LinearSVR
]

.pull-right[ ![Support vector machines](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r2.png)]

---

# K nearest neighbors

.pull-left[
- Prediction based on the nearest neighbours
- Examples
    - K Nearest neighbours: based on k neighbours
    - Radius neighbours: neighbours within r radius
- Advantages
    - Simple to understand
    - Non-parametric
- Disadvantages
    - Runtime increases with data
    - High memory requirements
    - Insensitive to outliers
]

.pull-right[  ![K nearest neighbours](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r3.png)]

---

# Decision tree

.pull-left[
- Decision rules and paths
- Advantages
    - Easy to interpret
    - Logarithmic cost for prediction
- Disadvantages
    - Sensitive to variations in data
    - Prone to overfit
    - Need to balance dataset
]

.pull-right[ ![Decision tree](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r4.png)]

---

# Ensemble models

.pull-left[
- Combination of multiple trees
- Bagging
    - Build independent multiple trees 
    - Average prediction
    - Examples
        - Random Forest
        - Extremely Randomised Trees
- Boosting
    - Improve tree models sequentially
    - Combine weak models to robust ensemble
    - Examples
        - AdaBoost
        - GradientBoosting
]

.pull-right[ ![Ensemble model](/training-material/topics/statistics/tutorials/regression_machinelearning/images/r5.png)]

### &lt;i class=&quot;fas fa-key&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;visually-hidden&quot;&gt;keypoints&lt;/span&gt; Key points


- Regression is a supervised approach in machine learning.

- For regression tasks, data is divided into training and test sets.

- Using regression, the samples are learned using the training set and predicted using the test set.

- For each regression algorithm, the parameters should be optimised based on the dataset.

- Regression methods can be applied to, for example, RNA-seq gene expression to predict biological age.
