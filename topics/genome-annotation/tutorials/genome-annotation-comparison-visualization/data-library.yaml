items:
- name: Genome Annotation
  description: In this tutorial, you will perform a complete workflow for fungal genome annotation, comparative genomics, and visualization. Starting from raw Mucor mucedo genomic and RNA-seq data, you will run Funannotate to generate structural and functional annotations. The predicted proteome is then compared with complete proteomes from related Mucor species and Saccharomyces cerevisiae using OrthoFinder to identify orthogroups and assess evolutionary relationships. Finally, the annotated genome and comparative results are explored and visualized using JBrowse2 for interactive genome browsing and Circos to display synteny and genomic relationships.
