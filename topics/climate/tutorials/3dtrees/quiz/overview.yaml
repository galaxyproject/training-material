title: What can the overview tell you?
contributors:
- kgerb
- Marie59
questions:
- title: Which overview image is best for spotting gaps in the canopy?
  answers:
  - The top view
  - The section (side) view
  - Neither of them
  correct: The top view
  timeout: 30
  type: choose-1
- title: Which overview image shows how the vegetation is layered above the ground?
  answers:
  - The top view
  - The section (side) view
  - Neither of them
  correct: The section (side) view
  timeout: 30
  type: choose-1
- title: In which close-up do you expect individual trees to be harder to separate?
  answers:
  - "Close-up A: taller crowns with gaps between them"
  - "Close-up B: lower crowns that touch each other"
  correct: "Close-up B: lower crowns that touch each other"
  timeout: 30
  type: choose-1
