title: Instance and semantic predictions
contributors:
- kgerb
- Marie59
questions:
- title: Two neighbouring crowns are both predicted as trees but have different PredInstance_SAT values. What does that mean?
  answers:
  - They have the same class (tree) but are two different individual trees.
  - They are the same tree, split into two classes.
  - One of them is ground and the other is a tree.
  - They belong to different tree species.
  correct: They have the same class (tree) but are two different individual trees.
  timeout: 45
  type: choose-1
- title: Where do PredSemantic_SAT and PredInstance_SAT come from?
  answers:
  - The LiDAR scanner measures them during the flight.
  - SegmentAnyTree predicts them and adds them to the point cloud.
  - The Standardization tool computes them from the file header.
  correct: SegmentAnyTree predicts them and adds them to the point cloud.
  timeout: 30
  type: choose-1
