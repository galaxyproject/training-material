title: Instance and semantic predictions
contributors:
- kgerb
- Marie59
questions:
- title: Two neighbouring crowns are both predicted as vegetation but have different PredInstance_SAT values. What does that mean?
  answers:
  - They have the same class (vegetation) but are two different individual trees.
  - They are the same tree, split into two classes.
  - One of them is ground and the other is vegetation.
  - They belong to different tree species.
  correct: They have the same class (vegetation) but are two different individual trees.
  timeout: 45
  type: choose-1
- title: Which analyses need the individual-tree instances (PredInstance_SAT)? Select all that apply.
  answers:
  - Predicting the species of each tree
  - Measuring the height of each tree
  - Counting the trees in the survey area
  - Mapping where there is vegetation at all
  correct:
  - Predicting the species of each tree
  - Measuring the height of each tree
  - Counting the trees in the survey area
  timeout: 45
  type: choose-many
