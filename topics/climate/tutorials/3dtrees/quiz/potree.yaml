title: Does the segmentation look plausible?
contributors:
- kgerb
- Marie59
questions:
- title: Which observations support a plausible segmentation? Select all that apply.
  answers:
  - Most instance colours follow recognisable tree crowns rather than scattered patches.
  - Neighbouring, visibly separate crowns usually have different colours.
  - Visible ground points are mostly in the non-vegetation class of PredSemantic_SAT.
  - Many crowns are cut exactly along straight processing boundaries.
  - One colour spans many unrelated crowns.
  correct:
  - Most instance colours follow recognisable tree crowns rather than scattered patches.
  - Neighbouring, visibly separate crowns usually have different colours.
  - Visible ground points are mostly in the non-vegetation class of PredSemantic_SAT.
  timeout: 60
  type: choose-many
- title: Why is this only a visual check and not an accuracy assessment? Select all that apply.
  answers:
  - A result can look plausible and still contain missed, merged or split trees.
  - We did not compare the predictions with independently labelled reference trees.
  - Measuring accuracy needs reference labels and a method to compare them with predictions.
  - Potree proves that every displayed tree is correct.
  correct:
  - A result can look plausible and still contain missed, merged or split trees.
  - We did not compare the predictions with independently labelled reference trees.
  - Measuring accuracy needs reference labels and a method to compare them with predictions.
  timeout: 60
  type: choose-many
