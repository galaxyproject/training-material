# End-to-end test using the tutorial's single flight-area file (477 MB).
# Run on a Galaxy server with the pinned 3Dtrees tools and a GPU runner for SAT.
# Check file structure and prediction attributes rather than exact tree IDs,
# which can vary between model runs. Element identifiers were observed in a
# run on usegalaxy.eu with SmartTile 2.4.1.
- doc: Process Pic Saint-Loup flight area D and create an interactive tree visualization
  job:
    Point cloud (LAS/LAZ):
      class: File
      location: https://entrepot.recherche.data.gouv.fr/api/access/datafile/121030
      name: Strip-20210804-150144_D.las
      filetype: laz
  outputs:
    standardized:
      asserts:
        - that: has_size
          min: 1000000
        - that: has_text
          text: LASF
    metadata:
      asserts:
        - that: has_text_matching
          expression: '"standardized"\s*:\s*true'
        - that: has_text_matching
          expression: '"point_count"\s*:\s*15896349'
    convex_hull:
      asserts:
        has_json_property_with_text:
          property: type
          text: FeatureCollection
    tiling_preview:
      asserts:
        has_size:
          min: 1000
    segmented:
      element_tests:
        standardized_subsampled_10cm:
          asserts:
            - that: has_text
              text: LASF
            - that: has_text
              text: PredInstance_SAT
            - that: has_text
              text: PredSemantic_SAT
    originals_with_predictions:
      element_tests:
        standardized:
          asserts:
            - that: has_size
              min: 1000000
            - that: has_text
              text: PredInstance_SAT
            - that: has_text
              text: PredSemantic_SAT
    potree_viewer:
      asserts:
        has_text:
          text: Potree.loadPointCloud
