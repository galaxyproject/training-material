items:
- name: Synthetic Biology
  description: "Synthetic Biology is the engineering of biology : the deliberate (re)design
    and construction of novel biological and biologically based parts, devices and
    systems to perform new functions for useful purposes, that draws on principles
    elucidated from biology and engineering.\nBy applying these principles to living
    systems, Synthetic Biology overcomes mimicry and optimisation-led research and
    introduces a rationale and systematic approach to the construction and (re)design.\nSynthetic
    Biology is at the intersection of engineering, bioscience, chemistry, and information
    technology.\nThe goal of synthetic biology is to extend or modify the behavior
    of organisms and engineer them to perform new tasks. \nIn this section, the tutorials
    shows how to design metabolic pathways for producing the desired chemical targets.\n"
