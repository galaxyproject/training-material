- doc: |
    Test the SpatialData QC-to-Communication Pipeline on the 10x Genomics FFPE Human
    Skin Primary Dermal Melanoma Xenium Prime 5K section. Inputs are fetched from the
    Zenodo record for this tutorial rather than committed to the repository, because
    the SpatialData archive and the AnnData outputs are far too large to ship as
    test data. Outputs are checked with assertions rather than byte-for-byte
    comparison, so that the test tolerates the small numerical differences that
    Leiden, UMAP and the permutation tests produce between runs.
  job:
    spatialdata:
      class: File
      location: https://zenodo.org/records/21792657/files/melanoma.spatialdata.zip
      filetype: spatialdata.zip
    Resolution:
      class: File
      location: https://zenodo.org/records/21792657/files/Resolution.txt
      filetype: txt
    table association: labels
    Image element name: morphology_focus
    Channels element name: DAPI
    Label element name: cell_labels
    Shapes element name: null
    Points element name: null
    coordinate system: global
    Proportion of top genes for QC: 50,100,200,300
    Filter data by cell volume?: true
    Key in spatialdata object specifying the volume/area: cell_area
    Minimum cell volume: '10'
    Maximum cell volume: '400'
    minimum number of genes for a cell to pass: '10'
    minimum number of counts for a cell to pass: '10'
    minimum number of cells for a gene to pass: '3'
    minimum number of counts for a gene to pass: '3'
    maximum number of counts for a cell to pass: '100000000'
    maximum number of genes for a cell to pass: '100000000'
    Use seurat flavor for highly variable gene selection: false
    n_top_genes: '2000'
    batch_key: null
    Regress out volume and total_counts?: false
    Perform scaling?: true
    number of expected clusters: '9'
    Subsample the AnnData?: false
    Fraction of cells to subsample: '1.0'
    select celltypist model: Adult_Human_Skin_v1
  outputs:
    initial Anndata table:
      asserts:
        has_size:
          value: 79419490
          delta: 20000000
    Final table info of cells and genes during filtering:
      asserts:
        has_n_columns:
          n: 3
        has_text:
          text: '112551'
        has_line:
          line: "cells max_volume\t108749\t5006"
    Filtered AnnData table:
      asserts:
        has_size:
          value: 82249269
          delta: 20000000
    selected resolution:
      asserts:
        has_text:
          text: leiden_res_0.4
    ranked_genes table:
      asserts:
        has_n_columns:
          n: 6
        has_text_matching:
          expression: '^c_0\tS100A1'
        has_text:
          text: MLANA
    Final Anndata:
      asserts:
        has_size:
          value: 139929887
          delta: 35000000
    spatialdata_output_processed:
      asserts:
        has_size:
          value: 100000000
          delta: 100000000
    QC plots:
      asserts:
        has_size:
          value: 131377
          delta: 60000
    QC plots filtered:
      asserts:
        has_size:
          value: 132917
          delta: 60000
    QC plots filtered volume:
      asserts:
        has_size:
          value: 211726
          delta: 90000
    spatial scatter plots:
      asserts:
        has_size:
          value: 406156
          delta: 180000
    spatial scatter plots filtered:
      asserts:
        has_size:
          value: 404695
          delta: 180000
    spatial scatter plots filtered volume:
      asserts:
        has_size:
          value: 455589
          delta: 200000
    HVG plot:
      asserts:
        has_size:
          value: 39546
          delta: 20000
    PCA plot:
      asserts:
        has_size:
          value: 804705
          delta: 350000
    umap plot - general:
      asserts:
        has_size:
          value: 897260
          delta: 400000
    umap plot - leiden res:
      asserts:
        has_size:
          value: 595969
