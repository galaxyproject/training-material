<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Analysis pipeline for the Xenium primary dermal melanoma section</title>
  <desc>Flow diagram with eleven stages: cropped SpatialData input, quality control metrics, RNA and cell-area filtering, normalisation and feature selection, PCA and UMAP embedding, multi-resolution Leiden clustering, marker ranking, Squidpy spatial statistics, CellTypist reference transfer, LIANA ligand-receptor ranking, and the processed SpatialData output.</desc>

  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="30" y="30" width="300" height="94" rx="8" fill="#e8eef7" stroke="#3a5f8f" stroke-width="2"/>
  <text x="180" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">1. SpatialData input</text>
  <text x="180" y="80" text-anchor="middle" font-size="13" fill="#22303f">Xenium object: morphology image,</text>
  <text x="180" y="98" text-anchor="middle" font-size="13" fill="#22303f">cell labels, transcripts, table</text>
  <text x="180" y="116" text-anchor="middle" font-size="13" fill="#22303f">Cropped window, 10,810 x 5,006</text>

  <rect x="370" y="30" width="300" height="94" rx="8" fill="#e8eef7" stroke="#3a5f8f" stroke-width="2"/>
  <text x="520" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">2. Quality control metrics</text>
  <text x="520" y="80" text-anchor="middle" font-size="13" fill="#22303f">total_counts, n_genes_by_counts,</text>
  <text x="520" y="98" text-anchor="middle" font-size="13" fill="#22303f">cell_area, pct_counts_in_top_N</text>
  <text x="520" y="116" text-anchor="middle" font-size="13" fill="#22303f">mapped back onto the tissue</text>

  <rect x="710" y="30" width="300" height="94" rx="8" fill="#e8eef7" stroke="#3a5f8f" stroke-width="2"/>
  <text x="860" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f3a5f">3. Filtering</text>
  <text x="860" y="80" text-anchor="middle" font-size="13" fill="#22303f">RNA content, then cell area</text>
  <text x="860" y="98" text-anchor="middle" font-size="13" fill="#22303f">10,722 cells retained (99.2%),</text>
  <text x="860" y="116" text-anchor="middle" font-size="13" fill="#22303f">4,761 of 5,006 genes</text>

  <line x1="330" y1="77" x2="366" y2="77" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="77" x2="706" y2="77" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="30" y="184" width="300" height="94" rx="8" fill="#eaf3ea" stroke="#3f7d3f" stroke-width="2"/>
  <text x="180" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#255025">4. Normalisation</text>
  <text x="180" y="234" text-anchor="middle" font-size="13" fill="#22303f">Target sum 10,000, then log1p</text>
  <text x="180" y="252" text-anchor="middle" font-size="13" fill="#22303f">2,000 highly variable genes</text>
  <text x="180" y="270" text-anchor="middle" font-size="13" fill="#22303f">flagged, not removed</text>

  <rect x="370" y="184" width="300" height="94" rx="8" fill="#eaf3ea" stroke="#3f7d3f" stroke-width="2"/>
  <text x="520" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#255025">5. Embedding</text>
  <text x="520" y="234" text-anchor="middle" font-size="13" fill="#22303f">Log-normalised matrix feeds PCA</text>
  <text x="520" y="252" text-anchor="middle" font-size="13" fill="#22303f">Expression-neighbour graph</text>
  <text x="520" y="270" text-anchor="middle" font-size="13" fill="#22303f">(15 neighbours), then UMAP</text>

  <rect x="710" y="184" width="300" height="94" rx="8" fill="#eaf3ea" stroke="#3f7d3f" stroke-width="2"/>
  <text x="860" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#255025">6. Leiden clustering</text>
  <text x="860" y="234" text-anchor="middle" font-size="13" fill="#22303f">Resolutions 0.2, 0.4 and 0.6</text>
  <text x="860" y="252" text-anchor="middle" font-size="13" fill="#22303f">give 4, 6 and 9 groups</text>
  <text x="860" y="270" text-anchor="middle" font-size="13" fill="#22303f">leiden_res_0.6 selected</text>

  <line x1="330" y1="231" x2="366" y2="231" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="231" x2="706" y2="231" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="128" x2="860" y2="180" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3 -->
  <rect x="30" y="338" width="300" height="94" rx="8" fill="#fbf1e3" stroke="#a3701f" stroke-width="2"/>
  <text x="180" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d4a12">7. Marker ranking</text>
  <text x="180" y="388" text-anchor="middle" font-size="13" fill="#22303f">Wilcoxon rank-sum test with</text>
  <text x="180" y="406" text-anchor="middle" font-size="13" fill="#22303f">Benjamini-Hochberg correction,</text>
  <text x="180" y="424" text-anchor="middle" font-size="13" fill="#22303f">each group against the rest</text>

  <rect x="370" y="338" width="300" height="94" rx="8" fill="#fbf1e3" stroke="#a3701f" stroke-width="2"/>
  <text x="520" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d4a12">8. Squidpy statistics</text>
  <text x="520" y="388" text-anchor="middle" font-size="13" fill="#22303f">Spatial-neighbour graph,</text>
  <text x="520" y="406" text-anchor="middle" font-size="13" fill="#22303f">centrality, neighbourhood</text>
  <text x="520" y="424" text-anchor="middle" font-size="13" fill="#22303f">enrichment, Moran's I</text>

  <rect x="710" y="338" width="300" height="94" rx="8" fill="#fbf1e3" stroke="#a3701f" stroke-width="2"/>
  <text x="860" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d4a12">9. Reference transfer</text>
  <text x="860" y="388" text-anchor="middle" font-size="13" fill="#22303f">CellTypist adult human skin</text>
  <text x="860" y="406" text-anchor="middle" font-size="13" fill="#22303f">model with majority voting;</text>
  <text x="860" y="424" text-anchor="middle" font-size="13" fill="#22303f">labels are preliminary only</text>

  <line x1="330" y1="385" x2="366" y2="385" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="385" x2="706" y2="385" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="282" x2="180" y2="334" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 4 -->
  <rect x="200" y="492" width="300" height="94" rx="8" fill="#f4ecf5" stroke="#7a4a86" stroke-width="2"/>
  <text x="350" y="520" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f2c58">10. LIANA</text>
  <text x="350" y="542" text-anchor="middle" font-size="13" fill="#22303f">Ligand-receptor pairs ranked</text>
  <text x="350" y="560" text-anchor="middle" font-size="13" fill="#22303f">between Leiden groups from</text>
  <text x="350" y="578" text-anchor="middle" font-size="13" fill="#22303f">expression alone</text>

  <rect x="540" y="492" width="300" height="94" rx="8" fill="#f4ecf5" stroke="#7a4a86" stroke-width="2"/>
  <text x="690" y="520" text-anchor="middle" font-size="15" font-weight="bold" fill="#4f2c58">11. SpatialData output</text>
  <text x="690" y="542" text-anchor="middle" font-size="13" fill="#22303f">Processed table written back</text>
  <text x="690" y="560" text-anchor="middle" font-size="13" fill="#22303f">as table_processed beside the</text>
  <text x="690" y="578" text-anchor="middle" font-size="13" fill="#22303f">image and segmentation labels</text>

  <line x1="500" y1="539" x2="536" y2="539" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="436" x2="860" y2="470" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="860" y1="470" x2="350" y2="470" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="350" y1="470" x2="350" y2="488" stroke="#4a4a4a" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
