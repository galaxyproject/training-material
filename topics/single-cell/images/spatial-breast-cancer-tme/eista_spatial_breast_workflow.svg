<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Breast cancer Visium analysis workflow</title>
<desc id="desc">An organised hexagonal Visium spot grid is imported into SpatialData, analysed with Scanpy and IUC Squidpy tools, annotated with CellTypist and LIANA, and returned to SpatialData.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#333"/></marker></defs>
<style>.bg{fill:#fbfbf8}.panel{fill:#fff;stroke:#333;stroke-width:2}.title{font:bold 24px Arial,sans-serif;fill:#111}.head{font:bold 21px Arial,sans-serif;fill:#111;text-anchor:middle}.body{font:17px Arial,sans-serif;fill:#222;text-anchor:middle}.small{font:15px Arial,sans-serif;fill:#333}.box{fill:#f3f3f3;stroke:#777;stroke-width:1.2}.arrow{stroke:#333;stroke-width:3;fill:none;marker-end:url(#arrow)}.spot{fill:#4477aa;stroke:#fff;stroke-width:1.4;opacity:.82}.edge{stroke:#777;stroke-width:1.4;opacity:.8}</style>
<rect class="bg" width="1400" height="700"/>
<text x="50" y="48" class="title">Biological workflow: breast cancer Visium section to interpretable spatial TME hypotheses</text>
<rect x="45" y="85" width="250" height="475" rx="16" class="panel"/><text x="170" y="125" class="head">Input data</text>
<rect x="75" y="155" width="190" height="150" fill="#f5e5df" stroke="#777"/>
<!-- organised Visium-style offset grid -->
<g>
<circle cx="105" cy="185" r="8" class="spot"/><circle cx="135" cy="185" r="8" class="spot"/><circle cx="165" cy="185" r="8" class="spot"/><circle cx="195" cy="185" r="8" class="spot"/><circle cx="225" cy="185" r="8" class="spot"/>
<circle cx="120" cy="211" r="8" class="spot"/><circle cx="150" cy="211" r="8" class="spot"/><circle cx="180" cy="211" r="8" class="spot"/><circle cx="210" cy="211" r="8" class="spot"/><circle cx="240" cy="211" r="8" class="spot"/>
<circle cx="105" cy="237" r="8" class="spot"/><circle cx="135" cy="237" r="8" class="spot"/><circle cx="165" cy="237" r="8" class="spot"/><circle cx="195" cy="237" r="8" class="spot"/><circle cx="225" cy="237" r="8" class="spot"/>
<circle cx="120" cy="263" r="8" class="spot"/><circle cx="150" cy="263" r="8" class="spot"/><circle cx="180" cy="263" r="8" class="spot"/><circle cx="210" cy="263" r="8" class="spot"/><circle cx="240" cy="263" r="8" class="spot"/>
</g>
<text x="170" y="340" class="body">10x Visium files</text><text x="75" y="375" class="small">• filtered count matrix (.h5)</text><text x="75" y="403" class="small">• H&amp;E tissue image</text><text x="75" y="431" class="small">• organised spot positions</text><text x="75" y="459" class="small">• scale factors</text>
<path d="M305 320 H375" class="arrow"/>
<rect x="385" y="85" width="260" height="475" rx="16" class="panel"/><text x="515" y="125" class="head">SpatialData</text>
<rect x="425" y="160" width="180" height="52" class="box"/><text x="515" y="192" class="body">Images</text>
<rect x="425" y="230" width="180" height="52" class="box"/><text x="515" y="262" class="body">Shapes / spots</text>
<rect x="425" y="300" width="180" height="52" class="box"/><text x="515" y="332" class="body">Tables</text>
<rect x="425" y="370" width="180" height="52" class="box"/><text x="515" y="402" class="body">Transformations</text>
<rect x="415" y="455" width="200" height="62" class="box"/><text x="515" y="482" class="body">Coordinates stay linked</text><text x="515" y="505" class="body">to expression</text>
<path d="M655 320 H725" class="arrow"/>
<rect x="735" y="85" width="260" height="475" rx="16" class="panel"/><text x="865" y="125" class="head">AnnData + Scanpy</text>
<rect x="775" y="160" width="180" height="52" class="box"/><text x="865" y="192" class="body">QC metrics</text>
<rect x="775" y="230" width="180" height="52" class="box"/><text x="865" y="262" class="body">Filtering</text>
<rect x="775" y="300" width="180" height="52" class="box"/><text x="865" y="332" class="body">Normalisation</text>
<rect x="775" y="370" width="180" height="52" class="box"/><text x="865" y="402" class="body">PCA / UMAP</text>
<rect x="775" y="440" width="180" height="52" class="box"/><text x="865" y="472" class="body">Leiden clusters</text>
<path d="M1005 320 H1075" class="arrow"/>
<rect x="1085" y="85" width="270" height="475" rx="16" class="panel"/><text x="1220" y="125" class="head">Spatial biology</text>
<g><circle cx="1155" cy="200" r="20" fill="none" stroke="#555"/><circle cx="1240" cy="170" r="20" fill="none" stroke="#555"/><circle cx="1290" cy="235" r="20" fill="none" stroke="#555"/><circle cx="1190" cy="280" r="20" fill="none" stroke="#555"/><circle cx="1280" cy="330" r="20" fill="none" stroke="#555"/><line x1="1172" y1="190" x2="1223" y2="179" class="edge"/><line x1="1255" y1="185" x2="1278" y2="220" class="edge"/><line x1="1273" y1="246" x2="1207" y2="270" class="edge"/><line x1="1206" y1="292" x2="1263" y2="320" class="edge"/></g>
<rect x="1120" y="375" width="200" height="126" class="box"/><text x="1220" y="408" class="body">IUC Squidpy metrics</text><text x="1220" y="438" class="body">CellTypist annotations</text><text x="1220" y="468" class="body">LIANA interactions</text>
<path d="M1220 575 C1080 650 650 650 515 575" class="arrow"/><rect x="470" y="610" width="750" height="52" class="box"/><text x="845" y="642" class="body">Processed annotations return to the SpatialData table for reusable spatial interpretation</text>
</svg>