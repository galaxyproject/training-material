<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
<title id="title">Spatial cluster interpretation in the breast tumour microenvironment</title>
<desc id="desc">An organised Visium spot grid overlays broad tumour, stromal, immune and adipose regions. A second panel lists checks for morphology, markers, neighbourhood enrichment, ligand-receptor plausibility and validation.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#111"/></marker></defs>
<style>.bg{fill:#fbfbf8}.title{font:bold 26px Arial,sans-serif;fill:#111}.head{font:20px Arial,sans-serif;fill:#111}.small{font:16px Arial,sans-serif;fill:#222}.panel{fill:#fff;stroke:#333;stroke-width:1.5}.tumour{fill:#cf6f68;opacity:.78}.stroma{fill:#b7d7a0;opacity:.82}.immune{fill:#79aeda;opacity:.85}.adipose{fill:#f0d47f;opacity:.82}.spot{fill:#fff;stroke:#222;stroke-width:1.5}.edge{stroke:#555;stroke-width:1;opacity:.45}.arrow{stroke:#111;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#f6f6f6;stroke:#444;stroke-width:1.2}.signal{font:15px Arial,sans-serif;fill:#222}.check-title{font:bold 15px Arial,sans-serif;fill:#222}.check-body{font:14px Arial,sans-serif;fill:#333}</style>
<rect class="bg" width="1400" height="790"/><text x="52" y="52" class="title">From spatial clusters to breast cancer TME hypotheses</text>
<rect x="60" y="88" width="790" height="610" rx="18" class="panel"/><text x="92" y="126" class="head">A. Candidate tissue regions with an organised Visium capture grid</text>
<ellipse cx="355" cy="360" rx="250" ry="215" class="tumour"/><ellipse cx="535" cy="360" rx="250" ry="215" class="stroma"/><ellipse cx="625" cy="405" rx="130" ry="130" class="immune"/><ellipse cx="280" cy="570" rx="190" ry="110" class="adipose"/>
<g>
<!-- six offset rows -->
<g transform="translate(0,0)"><circle cx="150" cy="215" r="13" class="spot"/><circle cx="215" cy="215" r="13" class="spot"/><circle cx="280" cy="215" r="13" class="spot"/><circle cx="345" cy="215" r="13" class="spot"/><circle cx="410" cy="215" r="13" class="spot"/><circle cx="475" cy="215" r="13" class="spot"/></g>
<g><circle cx="182" cy="275" r="13" class="spot"/><circle cx="247" cy="275" r="13" class="spot"/><circle cx="312" cy="275" r="13" class="spot"/><circle cx="377" cy="275" r="13" class="spot"/><circle cx="442" cy="275" r="13" class="spot"/><circle cx="507" cy="275" r="13" class="spot"/><circle cx="572" cy="275" r="13" class="spot"/></g>
<g><circle cx="150" cy="335" r="13" class="spot"/><circle cx="215" cy="335" r="13" class="spot"/><circle cx="280" cy="335" r="13" class="spot"/><circle cx="345" cy="335" r="13" class="spot"/><circle cx="410" cy="335" r="13" class="spot"/><circle cx="475" cy="335" r="13" class="spot"/><circle cx="540" cy="335" r="13" class="spot"/><circle cx="605" cy="335" r="13" class="spot"/></g>
<g><circle cx="182" cy="395" r="13" class="spot"/><circle cx="247" cy="395" r="13" class="spot"/><circle cx="312" cy="395" r="13" class="spot"/><circle cx="377" cy="395" r="13" class="spot"/><circle cx="442" cy="395" r="13" class="spot"/><circle cx="507" cy="395" r="13" class="spot"/><circle cx="572" cy="395" r="13" class="spot"/><circle cx="637" cy="395" r="13" class="spot"/></g>
<g><circle cx="150" cy="455" r="13" class="spot"/><circle cx="215" cy="455" r="13" class="spot"/><circle cx="280" cy="455" r="13" class="spot"/><circle cx="345" cy="455" r="13" class="spot"/><circle cx="410" cy="455" r="13" class="spot"/><circle cx="475" cy="455" r="13" class="spot"/><circle cx="540" cy="455" r="13" class="spot"/><circle cx="605" cy="455" r="13" class="spot"/><circle cx="670" cy="455" r="13" class="spot"/></g>
</g>
<path d="M480 285 C550 245 625 260 680 320" class="arrow"/><text x="552" y="250" class="signal">CXCL / CCL signals</text>
<path d="M450 475 C515 545 615 555 710 505" class="arrow"/><text x="548" y="575" class="signal">ECM / growth-factor signals</text>
<rect x="92" y="580" width="725" height="100" rx="9" class="box"/><text x="112" y="605" class="signal">Computational readout: Leiden clusters, spatial enrichment, centrality,</text><text x="112" y="627" class="signal">Moran’s I, and LR ranking.</text><text x="112" y="651" class="signal">Interpretation: tumour-stroma boundaries and immune-rich niches,</text><text x="112" y="673" class="signal">adipose regions, and other candidate compartments.</text>
<rect x="890" y="88" width="450" height="610" rx="18" class="panel"/><text x="915" y="126" class="head">B. Interpretation checks</text>
<rect x="915" y="154" width="400" height="82" rx="8" class="box"/>
<text x="940" y="181" class="check-title">1. Do clusters match tissue morphology?</text>
<text x="940" y="211" class="check-body">Compare Leiden annotations with spatial plots.</text>
<rect x="915" y="254" width="400" height="82" rx="8" class="box"/>
<text x="940" y="281" class="check-title">2. Do marker genes support interpretation?</text>
<text x="940" y="307" class="check-body">Check coherent epithelial, stromal, and</text>
<text x="940" y="327" class="check-body">immune marker programmes.</text>
<rect x="915" y="354" width="400" height="82" rx="8" class="box"/>
<text x="940" y="381" class="check-title">3. Are neighbours enriched?</text>
<text x="940" y="411" class="check-body">Use the physical spatial graph, not only UMAP.</text>
<rect x="915" y="454" width="400" height="82" rx="8" class="box"/>
<text x="940" y="481" class="check-title">4. Are ligand-receptor pairs plausible?</text>
<text x="940" y="507" class="check-body">Prioritise adjacent clusters with expressed</text>
<text x="940" y="527" class="check-body">ligand and receptor genes.</text>
<rect x="915" y="554" width="400" height="82" rx="8" class="box"/>
<text x="940" y="581" class="check-title">5. What needs validation?</text>
<text x="940" y="611" class="check-body">Use pathology, IF/IHC, or targeted assays.</text>
<rect x="935" y="720" width="24" height="17" class="tumour"/><text x="970" y="735" class="small">tumour epithelial</text><rect x="1115" y="720" width="24" height="17" class="stroma"/><text x="1150" y="735" class="small">stroma</text><rect x="935" y="752" width="24" height="17" class="immune"/><text x="970" y="767" class="small">immune-rich</text><rect x="1115" y="752" width="24" height="17" class="adipose"/><text x="1150" y="767" class="small">adipose</text>
</svg>