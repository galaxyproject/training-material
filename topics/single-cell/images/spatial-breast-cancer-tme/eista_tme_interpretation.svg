<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Breast cancer tumour microenvironment interpretation schematic</title>
<desc id="desc">Original schematic illustrating tumour, stromal, immune, adipose and myoepithelial-like regions with Visium spots, spatial graph edges and ligand-receptor hypotheses.</desc>
<style>
  .bg{fill:#fbfbf8}.title{font:bold 26px Arial, sans-serif;fill:#111}.label{font:20px Arial, sans-serif;fill:#111}.small{font:16px Arial, sans-serif;fill:#222}.panel{fill:#fff;stroke:#333;stroke-width:1.5;rx:20}.tumour{fill:#cf6f68;opacity:.78}.stroma{fill:#b7d7a0;opacity:.82}.immune{fill:#79aeda;opacity:.85}.adipose{fill:#f0d47f;opacity:.82}.myo{fill:#b694c9;opacity:.82}.spot{fill:#fff;stroke:#222;stroke-width:1.5;opacity:.95}.edge{stroke:#555;stroke-width:1;opacity:.42}.arrow{stroke:#111;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.legend{fill:#fff;stroke:#555;stroke-width:1}.gene{font:italic 15px Arial, sans-serif;fill:#222}.box{fill:#f6f6f6;stroke:#444;stroke-width:1.2;rx:10}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 z" fill="#111"/></marker></defs>
<rect class="bg" width="1400" height="760"/>
<text x="52" y="54" class="title">From spatial clusters to breast cancer TME hypotheses</text>
<rect x="60" y="90" width="780" height="560" class="panel"/>
<text x="92" y="128" class="label">A. Tissue domains with Visium capture spots</text>
<path class="tumour" d="M135,190 C230,115 390,115 500,190 C610,265 600,445 475,520 C330,610 145,540 112,400 C95,320 92,245 135,190Z"/>
<path class="stroma" d="M465,145 C615,120 755,220 780,370 C805,520 690,610 540,585 C630,512 647,412 602,305 C575,240 530,190 465,145Z"/>
<path class="adipose" d="M105,445 C200,620 390,635 548,570 C458,675 215,690 105,565Z"/>
<path class="immune" d="M545,275 C665,275 745,335 742,430 C738,515 620,555 535,500 C595,440 598,345 545,275Z"/>
<path class="myo" d="M250,180 C320,145 425,165 485,235 C430,215 318,212 255,255 C212,285 190,345 195,410 C150,315 175,225 250,180Z"/>
<g id="grid">
<script type="application/ecmascript"><![CDATA[]]></script>
</g>
<!-- graph edges and spots drawn explicitly for portability -->
<g class="edges">
<line x1="160" y1="225" x2="225" y2="200" class="edge"/><line x1="225" y1="200" x2="290" y2="210" class="edge"/><line x1="290" y1="210" x2="355" y2="220" class="edge"/><line x1="355" y1="220" x2="420" y2="245" class="edge"/><line x1="420" y1="245" x2="485" y2="280" class="edge"/><line x1="485" y1="280" x2="550" y2="320" class="edge"/><line x1="550" y1="320" x2="615" y2="355" class="edge"/><line x1="615" y1="355" x2="680" y2="395" class="edge"/>
<line x1="145" y1="310" x2="220" y2="300" class="edge"/><line x1="220" y1="300" x2="295" y2="315" class="edge"/><line x1="295" y1="315" x2="370" y2="325" class="edge"/><line x1="370" y1="325" x2="445" y2="350" class="edge"/><line x1="445" y1="350" x2="520" y2="390" class="edge"/><line x1="520" y1="390" x2="595" y2="430" class="edge"/><line x1="595" y1="430" x2="670" y2="470" class="edge"/>
<line x1="175" y1="405" x2="250" y2="405" class="edge"/><line x1="250" y1="405" x2="325" y2="420" class="edge"/><line x1="325" y1="420" x2="400" y2="440" class="edge"/><line x1="400" y1="440" x2="475" y2="465" class="edge"/><line x1="475" y1="465" x2="550" y2="495" class="edge"/><line x1="550" y1="495" x2="625" y2="520" class="edge"/>
</g>
<g>
<circle cx="160" cy="225" r="13" class="spot"/><circle cx="225" cy="200" r="13" class="spot"/><circle cx="290" cy="210" r="13" class="spot"/><circle cx="355" cy="220" r="13" class="spot"/><circle cx="420" cy="245" r="13" class="spot"/><circle cx="485" cy="280" r="13" class="spot"/><circle cx="550" cy="320" r="13" class="spot"/><circle cx="615" cy="355" r="13" class="spot"/><circle cx="680" cy="395" r="13" class="spot"/>
<circle cx="145" cy="310" r="13" class="spot"/><circle cx="220" cy="300" r="13" class="spot"/><circle cx="295" cy="315" r="13" class="spot"/><circle cx="370" cy="325" r="13" class="spot"/><circle cx="445" cy="350" r="13" class="spot"/><circle cx="520" cy="390" r="13" class="spot"/><circle cx="595" cy="430" r="13" class="spot"/><circle cx="670" cy="470" r="13" class="spot"/>
<circle cx="175" cy="405" r="13" class="spot"/><circle cx="250" cy="405" r="13" class="spot"/><circle cx="325" cy="420" r="13" class="spot"/><circle cx="400" cy="440" r="13" class="spot"/><circle cx="475" cy="465" r="13" class="spot"/><circle cx="550" cy="495" r="13" class="spot"/><circle cx="625" cy="520" r="13" class="spot"/>
</g>
<path d="M475,290 C540,250 620,255 675,310" class="arrow"/><text x="542" y="245" class="gene">CXCL / CCL signals</text>
<path d="M450,455 C505,520 615,540 705,502" class="arrow"/><text x="560" y="575" class="gene">ECM / growth-factor signals</text>
<rect x="98" y="565" width="700" height="58" class="box"/><text x="122" y="590" class="small">Computational readout: Leiden clusters + spatial neighbourhood enrichment + centrality + Moran’s I + ligand-receptor ranking</text><text x="122" y="613" class="small">Biological interpretation: tumour-stroma boundaries, immune niches, adipose regions, invasive/DCIS-like compartments</text>
<rect x="890" y="90" width="450" height="560" class="panel"/>
<text x="925" y="128" class="label">B. Interpretation checks</text>
<rect x="930" y="165" width="365" height="70" class="box"/><text x="956" y="195" class="small">1. Do clusters match tissue morphology?</text><text x="956" y="218" class="small">Compare UMAP labels with spatial plots.</text>
<rect x="930" y="260" width="365" height="70" class="box"/><text x="956" y="290" class="small">2. Do marker genes support labels?</text><text x="956" y="313" class="small">Check epithelial, stromal, immune markers.</text>
<rect x="930" y="355" width="365" height="70" class="box"/><text x="956" y="385" class="small">3. Are neighbours enriched?</text><text x="956" y="408" class="small">Use the spatial graph, not only UMAP.</text>
<rect x="930" y="450" width="365" height="70" class="box"/><text x="956" y="480" class="small">4. Are ligand-receptor pairs plausible?</text><text x="956" y="503" class="small">Prioritise spatially adjacent clusters.</text>
<rect x="930" y="545" width="365" height="70" class="box"/><text x="956" y="575" class="small">5. What needs validation?</text><text x="956" y="598" class="small">Use pathology, IF/IHC, or targeted assays.</text>
<rect x="935" y="670" width="26" height="18" class="tumour"/><text x="970" y="686" class="small">tumour epithelial</text><rect x="1115" y="670" width="26" height="18" class="stroma"/><text x="1150" y="686" class="small">stroma</text>
<rect x="935" y="700" width="26" height="18" class="immune"/><text x="970" y="716" class="small">immune-rich</text><rect x="1115" y="700" width="26" height="18" class="adipose"/><text x="1150" y="716" class="small">adipose</text>
</svg>