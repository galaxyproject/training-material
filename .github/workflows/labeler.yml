name: "[CI] Pull Request Labeler"
on:
- pull_request_target

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: true
    - uses: ppremk/lfs-warning@v3.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        filesizelimit: 10MB
        labelName: "large-files-detected"
        #exclusionPatterns: |
        #  **/*.png
